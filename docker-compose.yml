# OpenWhale — gateway + dashboard.
#
#   cp .env.example .env      # fill in OPENWHALE_MASTER_KEY and the admin pair
#   docker compose up -d --build
#   open http://localhost:3000
#
# Read DEPLOYMENT.md before putting this on a machine that can reach the
# internet. The short version is below; the reasoning is there.

services:
  gateway:
    build: .
    image: openwhale:local
    command: ["node", "packages/apps/gateway/dist/index.js"]
    restart: unless-stopped
    env_file: [.env]
    environment:
      # The dashboard is the only thing that talks to it, over the compose
      # network, so the origin it accepts is the dashboard's public address.
      OPENWHALE_ALLOWED_ORIGIN: ${OPENWHALE_PUBLIC_URL:-http://localhost:3000}
    volumes:
      # Everything the engine owns: the database, the credential store, monitor
      # history, installed plugins. Named rather than bind-mounted so `docker
      # compose down` cannot take it with the containers.
      - openwhale-data:/data
    # NOT published. This process holds decrypted exchange keys, can place
    # orders, and installs plugins — which is to say, runs arbitrary code.
    # Publishing it would make the dashboard's login a formality. It reaches
    # the dashboard over the compose network and nothing else needs it.
    expose: ["3001"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/auth/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  dashboard:
    build: .
    image: openwhale:local
    command: ["node_modules/.bin/next", "start", "-p", "3002"]
    working_dir: /app/packages/apps/dashboard
    restart: unless-stopped
    environment:
      OPENWHALE_GATEWAY_URL: http://gateway:3001
    ports:
      # Loopback only. Put a TLS terminator in front before this is reachable
      # from anywhere else — the session cookie is Secure, so over plain http
      # the browser drops it and every login silently loops.
      - "127.0.0.1:3000:3002"
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  openwhale-data:
